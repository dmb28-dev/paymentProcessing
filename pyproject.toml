[tool.poetry]
name = "payment-processing-service"
version = "0.1.0"
description = "Async payment processing microservice with outbox pattern"
authors = ["Belayev Dmitriy"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
alembic = ">=1.14.0"
asyncpg = ">=0.30.0"
fastapi = ">=0.115.0"
faststream = {extras = ["rabbit"], version = ">=0.5.33"}
httpx = ">=0.28.0"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.7.0"
python-json-logger = ">=3.2.1"
sqlalchemy = ">=2.0.36"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
greenlet = ">=3.1.1"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
aiosqlite = ">=0.20.0"
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.8.0"
asgi-lifespan = ">=2.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.poetry.scripts]
api = "main:main"
consumer = "consumer:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations/versions",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "COM812",
    "D",
    "E501",
    "EM101",
    "EM102",
    "PTH",
    "RET504",
    "S101",
    "SIM108",
    "TRY003",
    "G004",
    "B008",
    "PLR0913",
    "C408",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
]